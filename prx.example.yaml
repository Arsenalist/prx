# prx — PR analytics for engineering teams
# Full configuration reference

# GitHub instances (supports multiple, including Enterprise)
instances:
  github:
    type: github
    base_url: https://api.github.com
    token:
      env: GITHUB_TOKEN
  # enterprise:
  #   type: github
  #   base_url: https://github.example.com/api/v3
  #   token:
  #     env: GHE_TOKEN
  #   tls_skip_verify: false

# Repositories to track
repos:
  - instance: github
    repo: your-org/your-repo
  # - instance: enterprise
  #   repo: corp/internal-api

# Team definitions (group repos for reporting)
teams:
  platform:
    display_name: Platform Team
    repos:
      - instance: github
        repo: your-org/your-repo
      # - instance: enterprise
      #   repo: corp/internal-api

# Fetch settings
fetch:
  states: [closed]
  per_page: 100
  max_retries: 3
  rate_limit_buffer: 100

# Default date range for analysis
date_range:
  preset: last-30d
  # Or use explicit dates:
  # start: "2026-01-01"
  # end: "2026-03-31"

# Output settings
output:
  format: table          # table, json, markdown, all
  directory: ./reports   # where markdown reports are written
  # timezone: America/New_York

# Test file patterns (regex) — used to classify LOC as test vs production
test_patterns:
  - "_test\\.go$"
  - "\\.test\\.(ts|js|tsx|jsx)$"
  - "\\.spec\\.(ts|js|tsx|jsx)$"
  - "/__tests__/"
  - "/test/"
  - "/tests/"

# Storage configuration
storage:
  provider: sqlite
  sqlite:
    path: ./prx.db

